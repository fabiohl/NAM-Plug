[package]
name = "nam-plug"
version = "1.3.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/fabiohl/NAM-Plug"
description = "NAM CLAP plugin — high-performance Neural Amp Modeler (NAM) inference in CLAP (CLever Audio Plug-in) format."
readme = "README.md"
authors = ["Fábio Henrique de Lima Silva <fhl.bsb@gmail.com>"]
keywords = ["audio", "dsp", "nam", "neural-amp-modeler", "clap", "plugin"]
categories = ["multimedia::audio", "multimedia"]
# All binary targets are declared explicitly via [[bin]] below. autobins = false
# prevents Cargo from auto-discovering every src/bin/*.rs as a crate target,
# which would otherwise compile nam_perf_guard_test.rs (a #[cfg(test)] module
# included by nam_perf_guard.rs) as a standalone binary.
autobins = false

[dependencies]
NeuralAmpModeler-rs = { version = "4.0.0", default-features = false, features = [
    "dual-mono",
] }
clack-common = "0.2"
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = [
    "audio-ports",
    "audio-ports-activation",
    "audio-ports-config",
    "clack-plugin",
    "gui",
    "latency",
    "log",
    "params",
    "state",
    "raw-window-handle_06",
    "thread-check",
    "track-info",
    "remote-controls",
    "param-indication",
    "preset-discovery",
    "render",
    "state-context",
    "tail",
    "timer",
] }
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "unstable-winit-030",
] }
rfd = "0.17.2"
# X11 XEmbed embedding: rwh-0.6 fallback path to extract the host
# X11 `Window` id from the CLAP window when `as_x11_handle()` is not usable.
raw-window-handle = "0.6"
clack-host = { version = "0.2", features = ["clack-plugin"], optional = true }
arboard = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
thiserror = "2.0"
rtrb = "0.4.1"
# rt-hardening (opt-in, Linux-only, never default): NOT activated in NAM-Plug.
# The plugin runs inside the DAW host process (cdylib); mlockall, SCHED_FIFO,
# CPU affinity and PM-QoS are host-level responsibilities delegated to the DAW.
# See docs/architecture.md §1.2.
libc = "0.2"
sha2 = "0.11"
clap-sys = "0.5"

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
NeuralAmpModeler-rs = { version = "4.0.0", features = ["testing"] }
nam-plug = { path = ".", features = ["testing"] }
clack-host = { version = "0.2", features = ["clack-plugin"] }
clap-sys = "0.5"
criterion = { version = "0.8", default-features = false }
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = "0.14"

[[bench]]
name = "clap_bench"
harness = false

[[bin]]
name = "ui_preview"
path = "src/bin/ui_preview.rs"

[[bin]]
name = "pgo_profiling_workload"
path = "src/bin/pgo_profiling_workload.rs"
required-features = ["testing"]

[[bin]]
name = "nam_perf_guard"
path = "src/bin/nam_perf_guard.rs"
required-features = ["testing"]

[[bin]]
name = "ab_opt_bench"
path = "src/bin/ab_opt_bench.rs"
required-features = ["testing"]

[[bin]]
name = "plug_ab_opt"
path = "src/bin/plug_ab_opt.rs"

# Unified-schema (engine `testing::receipt`) emitter/verifier for the long-suite
# receipt (target/logs/long-audit-receipt.jsonl). Testing-only because it reuses
# the engine receipt schema, which lives behind the engine `testing` feature.
[[bin]]
name = "plug_long_receipt"
path = "src/bin/plug_long_receipt.rs"
required-features = ["testing"]

[features]
default = ["dual-mono"]
testing = ["NeuralAmpModeler-rs/testing", "dep:clack-host", "clack-extensions/clack-host"]
dual-mono = ["NeuralAmpModeler-rs/dual-mono"]
heap-audit = ["NeuralAmpModeler-rs/heap-audit"]
# Display-server lifecycle tests. Off by default so the catch-all long phase
# never executes them without a dedicated Xvfb; the `gui` long phase enables it.
gui-x11 = []

[lib]
name = "nam_plug"
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true
lto = "thin"
opt-level = 3
codegen-units = 16
panic = "unwind"

# Criterion builds (`cargo bench`, `cargo bench --no-run`) inherit the release
# profile by default. Fat LTO over the whole graph at a single codegen unit is
# the single largest peak-memory operation in this repository and could OOM a
# 16 GiB host. Thin LTO keeps cross-crate inlining while bounding memory.
# Consequence: codegen differs from the shipped fat-LTO `release`/`dist`
# binaries, so the operator must re-bootstrap the Criterion baseline
# (`nam_perf_gate run --bootstrap-baseline`) before treating
# `--check` as a regression signal.
[profile.bench]
lto = "thin"
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "unwind"

# Non-LTO release profile for unit/integration test binaries (`tests-long.sh`):
# keeps `opt-level = 3` and `debug-assertions = false` while avoiding ThinLTO
# link bottlenecks across ~25 test executables.
[profile.release-nolto]
inherits = "release"
lto = false

[profile.dev]
debug = 1
opt-level = 0
incremental = true
split-debuginfo = "unpacked"

[lints.rust]
raw_borrows_via_references = "warn"

[lints.clippy]
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"

[package.metadata.docs.rs]
features = ["testing"]
rustdoc-args = ["--cfg", "docsrs"]

[patch.crates-io]
NeuralAmpModeler-rs = { path = "../NeuralAmpModeler-rs" }
