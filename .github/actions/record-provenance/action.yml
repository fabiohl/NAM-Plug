name: Record provenance
description: Write the canonical CI provenance line resolved from Cargo.lock and the sibling engine.

inputs:
  toolchain:
    description: Optional toolchain label appended to the provenance line (for example msrv-1.99.0).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Record provenance
      shell: bash
      env:
        PROV_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        mkdir -p target/logs
        sha=$(git rev-parse HEAD)
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
        eng_type="GAP:missing_lockfile"
        eng_ver="unknown"
        eng_chk="none"
        if [ -f Cargo.lock ]; then
          read -r eng_type eng_ver eng_chk < <(awk '
            /^\[\[package\]\]/ { in_pkg=0 }
            /^name = "NeuralAmpModeler-rs"/ { in_pkg=1 }
            in_pkg && /^version = / { gsub(/"/, "", $3); ver=$3 }
            in_pkg && /^source = / { gsub(/"/, "", $3); src=$3 }
            in_pkg && /^checksum = / { gsub(/"/, "", $3); chk=$3 }
            END {
              if (!ver) {
                print "GAP:engine_not_found unknown none"
                exit 0
              }
              if (src ~ /^registry\+/) {
                type="registry"
              } else if (src ~ /^git\+/) {
                type="git"
              } else if (src) {
                type=src
              } else {
                type="path"
              }
              printf "%s %s %s\n", type, ver, (chk ? chk : "none")
            }
          ' Cargo.lock)
        fi
        if aux_sha=$(git -C "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" rev-parse HEAD 2>/dev/null); then
          aux_engine="sha=$aux_sha"
        else
          aux_engine="GAP:sibling_absent"
        fi
        toolchain_suffix=""
        if [ -n "$PROV_TOOLCHAIN" ]; then
          toolchain_suffix=" toolchain=$PROV_TOOLCHAIN"
        fi
        rustc_v=$(rustc --version)
        cargo_v=$(cargo --version)
        printf 'PHASE: provenance sha=%s package_version=%s engine_type=%s engine_version=%s engine_checksum=%s auxiliary_engine=%s rustc=%s%s cargo=%s\n' \
          "$sha" "$version" "$eng_type" "$eng_ver" "$eng_chk" "$aux_engine" "$rustc_v" "$toolchain_suffix" "$cargo_v" | tee target/logs/ci-provenance.log
