name: CI

on:
  push:
    branches: [main, dev, 'dev-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

# Lints and quick QA run as separate jobs so a lint failure cannot suppress functional evidence.
# The sibling engine (`../NeuralAmpModeler-rs`) is checked out from GitHub (main) as an auxiliary
# checkout for parity oracles, reference fixtures and local testing fallbacks.
jobs:
  # x86_64 is the reference platform.
  x86_64-linux-lints:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
          . ./variables.env
          [ -n "${ENGINE_REPO:-}" ] || { echo "ERROR: ENGINE_REPO missing in variables.env" >&2; exit 1; }
          [ -n "${ENGINE_COMMIT:-}" ] || { echo "ERROR: ENGINE_COMMIT missing in variables.env" >&2; exit 1; }
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: ./.github/actions/engine-checkout
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev binutils appstream xvfb
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustup target add aarch64-unknown-linux-gnu && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        uses: ./.github/actions/record-provenance
      - name: Lints (fmt, check, clippy, doc, policies, packaging)
        run: ./utils/lints.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux-lints
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-x86_64-linux-lints
          path: target/logs/**
          retention-days: 14

  x86_64-linux-quick:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
          . ./variables.env
          [ -n "${ENGINE_REPO:-}" ] || { echo "ERROR: ENGINE_REPO missing in variables.env" >&2; exit 1; }
          [ -n "${ENGINE_COMMIT:-}" ] || { echo "ERROR: ENGINE_COMMIT missing in variables.env" >&2; exit 1; }
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: ./.github/actions/engine-checkout
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev binutils appstream xvfb
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        uses: ./.github/actions/record-provenance
      - name: Quick QA suite
        run: xvfb-run -a ./utils/tests-quick.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux-quick
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-x86_64-linux-quick
          path: target/logs/**
          retention-days: 14

  # linux-arm64 compilation and test execution are blocking CI gates.
  linux-arm64-lints:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
          . ./variables.env
          [ -n "${ENGINE_REPO:-}" ] || { echo "ERROR: ENGINE_REPO missing in variables.env" >&2; exit 1; }
          [ -n "${ENGINE_COMMIT:-}" ] || { echo "ERROR: ENGINE_COMMIT missing in variables.env" >&2; exit 1; }
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: ./.github/actions/engine-checkout
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev binutils appstream xvfb
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustup target add x86_64-unknown-linux-gnu && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        uses: ./.github/actions/record-provenance
      - name: Lints (fmt, check, clippy, doc, policies, packaging)
        run: ./utils/lints.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: linux-arm64-lints
          note: 'ARM64 compilation: blocking CI gate (D1).'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-arm64-lints
          path: target/logs/**
          retention-days: 14

  linux-arm64-quick:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
          . ./variables.env
          [ -n "${ENGINE_REPO:-}" ] || { echo "ERROR: ENGINE_REPO missing in variables.env" >&2; exit 1; }
          [ -n "${ENGINE_COMMIT:-}" ] || { echo "ERROR: ENGINE_COMMIT missing in variables.env" >&2; exit 1; }
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: ./.github/actions/engine-checkout
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev binutils appstream xvfb
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustup target add x86_64-unknown-linux-gnu && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        uses: ./.github/actions/record-provenance
      - name: Quick QA suite
        run: xvfb-run -a ./utils/tests-quick.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: linux-arm64-quick
          note: 'ARM64 native test execution: blocking CI gate.'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-arm64-quick
          path: target/logs/**
          retention-days: 14

  # MSRV job: validates compilation with rust-version from Cargo.toml (1.99.0).
  # rust-toolchain.toml pins `stable`, so RUSTUP_TOOLCHAIN is required to
  # override it; `rustup default` alone would be silently ignored.
  msrv:
    name: msrv (1.99.0)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
          . ./variables.env
          [ -n "${ENGINE_REPO:-}" ] || { echo "ERROR: ENGINE_REPO missing in variables.env" >&2; exit 1; }
          [ -n "${ENGINE_COMMIT:-}" ] || { echo "ERROR: ENGINE_COMMIT missing in variables.env" >&2; exit 1; }
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: ./.github/actions/engine-checkout
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.99.0 --no-self-update --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        uses: ./.github/actions/record-provenance
        with:
          toolchain: msrv-1.99.0
      - name: Cargo check (MSRV)
        shell: bash
        run: |
          set -euo pipefail
          . utils/_lib.sh
          SCRIPT_NAME=msrv
          STATUS_NAME=msrv
          lib_init
          trap 'trap_fail $?' ERR
          # run_step is the repository's canonical phase runner (utils/_lib.sh).
          run_step msrv_check cargo check --locked --workspace --all-targets --all-features
          finish
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: msrv (1.99.0)
          note: ${{ job.status == 'success' && 'MSRV cargo check passed.' || 'MSRV cargo check failed.' }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-msrv
          path: target/logs/**
          retention-days: 14
