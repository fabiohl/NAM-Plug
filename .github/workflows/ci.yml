name: CI

on:
  push:
    branches: [main, dev, 'dev-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # x86_64 is the reference platform: canonical lints + quick QA suite disciplines.
  x86_64-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libfontconfig1-dev binutils
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Lints (fmt check, check, clippy, policies)
        run: ./utils/lints.sh
      - name: Quick QA suite
        run: ./utils/tests-quick.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-x86_64-linux
          path: target/logs/**
          retention-days: 14

  # linux-arm64: compile-time verification and quick QA suite on aarch64.
  linux-arm64:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libfontconfig1-dev binutils
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Lints (fmt, check, clippy, policies)
        run: ./utils/lints.sh
      - name: Quick QA suite
        run: ./utils/tests-quick.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: linux-arm64
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-arm64
          path: target/logs/**
          retention-days: 14

  # MSRV job: validates compilation with rust-version from Cargo.toml (1.99.0).
  msrv:
    name: msrv (1.99.0)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libfontconfig1-dev
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.99.0 --no-self-update --profile minimal && rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Cargo check (MSRV)
        run: cargo check --locked --all-targets --features testing
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: msrv (1.99.0)
          note: ${{ job.status == 'success' && 'MSRV cargo check passed.' || 'MSRV cargo check failed.' }}
