name: Long QA Suite

# Release chain, decoupled: build-release.sh -> tests-long.sh --artifact -> build-release.sh --certify.
# This hosted workflow never certifies: certification runs on the operator's isolated host.
# Hosted runners lack an isolated CPU, BOLT, clap-validator and the C++ oracle render binary:
# those surface as typed GAPs. The `perf` phase is never selected here.
on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Comma-separated phase IDs (empty = hosted-safe default; perf is rejected)'
        type: string
        default: ''
      strict:
        description: 'Strict mode (treat gaps as failures)'
        type: boolean
        default: false

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: actions/checkout@v7
        with:
          repository: fabiohl/NeuralAmpModeler-rs
          path: NeuralAmpModeler-rs
      - name: Set up engine sibling symlink
        run: ln -sfn "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" "$RUNNER_WORKSPACE/NeuralAmpModeler-rs"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libfontconfig1-dev binutils xvfb
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if engine_sha=$(git -C ../NeuralAmpModeler-rs rev-parse HEAD 2>/dev/null); then
            engine="sha=$engine_sha"
          else
            engine="GAP engine_sibling_absent"
          fi
          printf 'PHASE: provenance sha=%s package_version=%s engine=%s\n' "$sha" "$version" "$engine" | tee target/logs/ci-provenance.log
      - name: Build canonical artifact
        env:
          STRICT_INPUT: ${{ inputs.strict }}
        run: |
          STRICT_FLAG=""
          if [ "$STRICT_INPUT" = "true" ]; then STRICT_FLAG="--strict"; fi
          ./utils/build-release.sh $STRICT_FLAG
      - name: Long QA Suite (artifact)
        env:
          PHASES_INPUT: ${{ inputs.phases }}
          STRICT_INPUT: ${{ inputs.strict }}
        run: |
          STRICT_FLAG=""
          if [ "$STRICT_INPUT" = "true" ]; then STRICT_FLAG="--strict"; fi
          # Hosted runners are not a comparable speed gate: the `perf` phase is
          # never selected here. Explicit phases are transported through the
          # environment, never interpolated into the shell command line.
          if [ -n "$PHASES_INPUT" ]; then
            case ",$PHASES_INPUT," in
              *,perf,*) echo "perf is not permitted on hosted runners" >&2; exit 2 ;;
            esac
            ONLY_ARGS=(--only "$PHASES_INPUT")
          else
            ONLY_ARGS=(--only "catch-all,gui,artifact")
          fi
          xvfb-run -a ./utils/tests-long.sh $STRICT_FLAG --artifact "${ONLY_ARGS[@]}"
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: Long QA Suite
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-logs-receipts
          path: |
            target/logs/**
            target/dist/build-receipt.json
            target/dist/release-receipt.json
          retention-days: 14
