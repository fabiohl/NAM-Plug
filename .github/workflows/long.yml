name: Long QA Suite

# Release chain, decoupled: build-release.sh -> tests-long.sh --artifact -> build-release.sh --certify.
# This hosted workflow never certifies: certification runs on the operator's isolated host.
# Hosted runners lack an isolated CPU and SCHED_FIFO privileges: those surface as
# typed GAPs. BOLT, clap-validator and the C++ parity oracle are provisioned below.
# The `perf` and `rt-heap` (time-threshold) phases are never selected here.
on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Comma-separated phase IDs (empty = hosted-safe default; perf/rt-heap rejected)'
        type: string
        default: ''
      strict:
        description: 'Strict mode (treat gaps as failures)'
        type: boolean
        default: false

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Load environment variables
        run: |
          while IFS='=' read -r key val; do
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            [ -z "$key" ] && continue
            val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            echo "$key=$val" >> "$GITHUB_ENV"
          done < variables.env
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: actions/checkout@v7
        with:
          repository: fabiohl/NeuralAmpModeler-rs
          path: NeuralAmpModeler-rs
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Set up engine sibling symlink
        run: ln -sfn "$GITHUB_WORKSPACE/NeuralAmpModeler-rs" "$RUNNER_WORKSPACE/NeuralAmpModeler-rs"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev binutils xvfb \
            llvm-bolt
      - name: Install clap-validator
        run: |
          curl -sL "$CLAP_VALIDATOR_URL" -o /tmp/clap-val.zip
          unzip -p /tmp/clap-val.zip | sudo tar -xz -C /usr/local/bin clap-validator
          sudo chmod +x /usr/local/bin/clap-validator
          rm -f /tmp/clap-val.zip
          clap-validator validate --help >/dev/null 2>&1 || true
      - name: Provision C++ parity oracle
        run: |
          cd "$GITHUB_WORKSPACE/NeuralAmpModeler-rs"
          utils/setup-third-party.sh
          oracle=$(utils/ensure_namcore_render.sh)
          test -x "$oracle"
          echo "NAM_CORE_RENDER_BIN=$oracle" >> "$GITHUB_ENV"
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add llvm-tools-preview
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          eng_type="GAP:missing_lockfile"
          eng_ver="unknown"
          eng_chk="none"
          if [ -f Cargo.lock ]; then
            read -r eng_type eng_ver eng_chk < <(awk '
              /^\[\[package\]\]/ { in_pkg=0 }
              /^name = "NeuralAmpModeler-rs"/ { in_pkg=1 }
              in_pkg && /^version = / { gsub(/"/, "", $3); ver=$3 }
              in_pkg && /^source = / { gsub(/"/, "", $3); src=$3 }
              in_pkg && /^checksum = / { gsub(/"/, "", $3); chk=$3 }
              END {
                if (!ver) {
                  print "GAP:engine_not_found unknown none"
                  exit 0
                }
                if (src ~ /^registry\+/) {
                  type="registry"
                } else if (src ~ /^git\+/) {
                  type="git"
                } else if (src) {
                  type=src
                } else {
                  type="path"
                }
                printf "%s %s %s\n", type, ver, (chk ? chk : "none")
              }
            ' Cargo.lock)
          fi
          if aux_sha=$(git -C ../NeuralAmpModeler-rs rev-parse HEAD 2>/dev/null); then
            aux_engine="sha=$aux_sha"
          else
            aux_engine="GAP:sibling_absent"
          fi
          printf 'PHASE: provenance sha=%s package_version=%s engine_type=%s engine_version=%s engine_checksum=%s auxiliary_engine=%s\n' \
            "$sha" "$version" "$eng_type" "$eng_ver" "$eng_chk" "$aux_engine" | tee target/logs/ci-provenance.log
      - name: Build canonical artifact
        env:
          STRICT_INPUT: ${{ inputs.strict }}
        run: |
          STRICT_FLAG=""
          if [ "$STRICT_INPUT" = "true" ]; then STRICT_FLAG="--strict"; fi
          ./utils/build-release.sh $STRICT_FLAG
      - name: Long QA Suite (artifact)
        env:
          PHASES_INPUT: ${{ inputs.phases }}
          STRICT_INPUT: ${{ inputs.strict }}
        run: |
          STRICT_FLAG=""
          if [ "$STRICT_INPUT" = "true" ]; then STRICT_FLAG="--strict"; fi
          # Hosted runners are not a comparable speed gate: the `perf` and
          # `rt-heap` timing phases are never selected here. Explicit phases are
          # transported through the environment, never interpolated into the
          # shell command line.
          if [ -n "$PHASES_INPUT" ]; then
            case ",$PHASES_INPUT," in
              *,perf,*) echo "perf is not permitted on hosted runners" >&2; exit 2 ;;
              *,rt-heap,*) echo "rt-heap is not permitted on hosted runners" >&2; exit 2 ;;
            esac
            ONLY_ARGS=(--only "$PHASES_INPUT")
          else
            ONLY_ARGS=(--only "catch-all,gui,artifact,heap-audit")
          fi
          xvfb-run -a ./utils/tests-long.sh $STRICT_FLAG --artifact "${ONLY_ARGS[@]}"
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: Long QA Suite
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-logs-receipts
          path: |
            target/logs/**
            target/dist/build-receipt.json
            target/dist/release-receipt.json
          if-no-files-found: error
          retention-days: 14
