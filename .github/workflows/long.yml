name: Long QA Suite

# Release chain, decoupled: build-release.sh -> tests-long.sh --artifact -> build-release.sh --certify.
# Hosted runners lack an isolated CPU, BOLT, clap-validator and the C++ oracle render binary:
# those surface as typed GAPs. With `strict: true` any GAP fails the run (expected on hosted
# runners); keep `strict: false` for a hosted dry audit and certify on the operator's host.
on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Comma-separated phase IDs (empty = all)'
        type: string
        default: ''
      strict:
        description: 'Strict mode (treat gaps as failures; enables certification)'
        type: boolean
        default: false

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev binutils xvfb
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Build canonical artifact
        run: |
          STRICT_FLAG=""
          if [ "${{ inputs.strict }}" = "true" ]; then STRICT_FLAG="--strict"; fi
          ./utils/build-release.sh $STRICT_FLAG
      - name: Long QA Suite (artifact)
        run: |
          STRICT_FLAG=""
          if [ "${{ inputs.strict }}" = "true" ]; then STRICT_FLAG="--strict"; fi
          ONLY_FLAG=""
          if [ -n "${{ inputs.phases }}" ]; then ONLY_FLAG="--only ${{ inputs.phases }}"; fi
          ./utils/tests-long.sh $STRICT_FLAG --artifact $ONLY_FLAG
      - name: Certify
        if: ${{ inputs.strict && inputs.phases == '' }}
        run: ./utils/build-release.sh --certify
      - name: Publish step summary
        if: always()
        run: |
          echo "### Long QA Suite Run Summary" >> $GITHUB_STEP_SUMMARY
          if [ -d target/logs ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -hE '^(RESULT:|PHASE:|STRICT:|ERROR:)' target/logs/*.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-logs-receipts
          path: |
            target/logs/**
            target/dist/build-receipt.json
            target/dist/release-receipt.json
          retention-days: 14
