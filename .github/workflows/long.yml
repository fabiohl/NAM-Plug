name: Long QA Suite

# Hosted QA workflow with a single, recommended configuration. It is
# intentionally zero-input: the GitHub "Run workflow" button must not ask
# questions. The hosted build is never strict, the QA runs the hosted-safe
# phase list (catch-all,gui,artifact,heap-audit) and certification remains
# operator-only. BOLT, clap-validator and the C++ parity oracle are
# provisioned below. `perf` and `rt-heap` are never selected here.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load environment variables
        uses: ./.github/actions/load-env
      - name: Checkout NeuralAmpModeler-rs (engine sibling)
        uses: ./.github/actions/engine-checkout
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_COMMIT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev binutils xvfb \
            llvm-bolt
      - name: Install clap-validator
        run: |
          set -o pipefail
          curl -fsSL --retry 3 --retry-delay 2 "$CLAP_VALIDATOR_URL" -o /tmp/clap-val.zip
          echo "$CLAP_VALIDATOR_SHA256  /tmp/clap-val.zip" | sha256sum -c -
          unzip -p /tmp/clap-val.zip | sudo tar -xz -C /usr/local/bin clap-validator
          sudo chmod +x /usr/local/bin/clap-validator
          rm -f /tmp/clap-val.zip
          test -x /usr/local/bin/clap-validator
          clap-validator validate --help >/dev/null
      - name: Provision C++ parity oracle
        run: |
          cd "$GITHUB_WORKSPACE/NeuralAmpModeler-rs"
          utils/setup-third-party.sh
          oracle=$(utils/ensure_namcore_render.sh)
          test -x "$oracle"
          echo "NAM_CORE_RENDER_BIN=$oracle" >> "$GITHUB_ENV"
          echo "NAM_REQUIRE_CPP_ORACLE=1" >> "$GITHUB_ENV"
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add llvm-tools-preview
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        uses: ./.github/actions/record-provenance
      - name: Build canonical artifact
        # Hosted QA builds are never strict; the operator release chain owns it.
        run: ./utils/build-release.sh
      - name: Provision preset discovery fixtures
        run: |
          mkdir -p "$HOME/.nam/models"
          cp tests/fixtures/models/*.nam "$HOME/.nam/models/"
      - name: Long QA Suite (artifact)
        # Recommended hosted-safe configuration, fixed by design. `perf` and
        # `rt-heap` are reserved for the operator's isolated host.
        run: xvfb-run -a ./utils/tests-long.sh --artifact --only 'catch-all,artifact,gui,heap-audit'
      - name: Write evidence manifest
        if: always()
        run: |
          mkdir -p target/logs
          build=false; if [ -f target/dist/build-receipt.json ]; then build=true; fi
          long_scope=none
          if [ -f target/logs/long-audit-receipt.jsonl ]; then long_scope=full
          elif [ -f target/logs/long-audit-receipt.*.partial.jsonl ]; then long_scope=partial
          fi
          certify=false
          if [ -f target/dist/release-receipt.json ]; then certify=true; fi
          printf '{"run_id":"%s","build_receipt":%s,"long_receipt_scope":"%s","certification_receipt":%s}\n' \
            "${{ github.run_id }}-${{ github.run_attempt }}" "$build" "$long_scope" "$certify" > target/logs/evidence-manifest.json
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: Long QA Suite
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: long-logs-receipts
          path: |
            target/logs/**
            target/dist/build-receipt.json
            target/dist/release-receipt.json
          if-no-files-found: error
          retention-days: 14
