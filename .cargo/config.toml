[build]
warnings = "deny"
rustflags = [
  # --- Architecture and Optimization Configuration (march / mtune) ---

  # OPTION 1 (Distributable Default):
  # Minimum hard requirement: CPUs with AVX2, FMA, and BMI2 (2013+).
  # Note: On Rust Stable (e.g. 1.95), '-Ctarget-cpu' sets BOTH the ISA (march) and generic tuning (mtune).
  "-Ctarget-cpu=x86-64-v3",

  # OPTION 2 (Maximum Local Optimization - "Native"):
  # Sets both march and mtune for your own current CPU.
  # WARNING: The resulting binary will be incompatible with older or different-family processors.
  # "-Ctarget-cpu=native",

  # --- Linker Optimizations ---
  # Remove dead code to reduce final binary size.
  "-Clink-arg=-Wl,--gc-sections",

  # CRITICAL FOR REAL-TIME (DSP): Forces dynamic symbol resolution at startup (Bind Now).
  # Prevents OS lazy-binding (e.g. calls to libm or libc) from occurring unexpectedly
  # during the audio DSP thread, which would cause lockups and XRuns (execution page-faults).
  "-Clink-arg=-Wl,-z,now",

  # Improves load speed by discarding listed libraries that are not actually used.
  "-Clink-arg=-Wl,--as-needed",

  # Forces retention of the CLAP entry point symbol, preventing it from being discarded by gc-sections
  "-Clink-arg=-Wl,-u,clap_entry",
]

# Permanent regression guard for an ELF symbol-interposition hang — see
# docs/postmortem-libm-symbol-interposition.md for the full writeup and
# .cargo/hide-libm-shadow.map for the linker version script itself.
#
# The `-Wl,--version-script` linker arg that neutralizes the hang is
# applied via `build.rs` (`cargo:rustc-link-arg`), NOT here. A global
# `[build] rustflags` entry would also apply to every dependency's own
# build-script helper binaries (e.g. `libc`'s, `target-lexicon`'s), which
# resolve relative paths from a different working directory and fail to
# find the map file at all. Scoping it to our own crate via `build.rs` +
# `env!("CARGO_MANIFEST_DIR")` avoids that entirely and is also more
# correct: only our own final binaries (the test harness, the standalone
# bin, the CLAP cdylib) need this protection.
